[pytest]
testpaths = tests
pythonpath = .
addopts =
    --strict-markers
    -rN
    --junitxml=artifacts/reports/junit.xml
    --cucumber-json=artifacts/reports/cucumber.json
bdd_features_base_dir = tests/features/
# A known-defect test that starts passing fails the run, so its @xfail tag gets removed.
xfail_strict = true
markers =
    ui: UI end-to-end tests
    api: API tests
log_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S
